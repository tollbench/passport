name: Publish Passport alpha

# Requires a PyPI Trusted Publisher binding and a protected GitHub environment.
# Maintainers explicitly run this workflow against a reviewed version tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Require matching version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          metadata = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          assert os.environ['RELEASE_TAG'] == 'v' + metadata['project']['version'], 'Version tag must match package metadata'
          PY
      - name: Test, build and inspect
        run: |
          node --test tests/*.test.mjs
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
          python -m build
          python -m twine check dist/*
          python -m pip install dist/*.whl
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -c "from importlib.resources import files; p=files('toll_passport').joinpath('web'); [p.joinpath(n).read_bytes() for n in ('index.html', 'app.mjs', 'vault.mjs', 'answers.mjs', 'style.css', 'hosted.html', 'hosted.mjs', 'hosted-bridge.mjs', 'question-channel.mjs', 'question-answer.mjs', 'question-batch-channel.mjs', 'question-batch.mjs')]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: passport-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/toll-passport/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: passport-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
