name: Verify Passport

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Test browser vault core
        run: node --test tests/*.test.mjs
      - name: Build distribution
        run: |
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
          python -m build
          python -m twine check dist/*
      - name: Install and test wheel
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s tests -p 'test_*.py' -v
          toll-passport --version
          python -c "from importlib.resources import files; p=files('toll_passport').joinpath('web'); [p.joinpath(n).read_bytes() for n in ('index.html', 'app.mjs', 'vault.mjs', 'answers.mjs', 'style.css', 'hosted.html', 'hosted.mjs', 'hosted-bridge.mjs', 'question-channel.mjs', 'question-answer.mjs', 'question-batch-channel.mjs', 'question-batch.mjs', 'topic-catalog.mjs', 'topic-editor.mjs', 'request-types.json', 'item-selection.mjs', 'item-share-channel.mjs', 'item-picker.mjs', 'local-import.mjs')]"
      - name: Browser acceptance
        if: matrix.python == '3.13'
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
          toll-passport serve > /tmp/passport-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python - <<'PYCODE'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError('Local server did not start')
          PYCODE
          python tests/browser_smoke.py
          python tests/browser_hosted.py
          python tests/browser_unlock.py
          python tests/browser_library.py
          python tests/browser_questions.py
          python tests/browser_batches.py
          python tests/browser_topics.py
          python tests/browser_autofill.py
          python tests/browser_items.py
          python tests/browser-unified-questions.py
