[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "toll-passport"
version = "0.1.0a13"
description = "An independent, owner-controlled information vault from Toll Bench"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Steven Ochs and Tollbench"}]
keywords = ["passport", "vault", "privacy", "encryption"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security :: Cryptography",
]
dependencies = []

[project.scripts]
toll-passport = "toll_passport.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toll_passport"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/NOTICE", "/SECURITY.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/docs", "/pyproject.toml", "/CITATION.cff", "/THIRD_PARTY_NOTICES.md"]

[project.urls]
Homepage = "https://github.com/tollbench/passport"
Repository = "https://github.com/tollbench/passport"
Issues = "https://github.com/tollbench/passport/issues"
Documentation = "https://github.com/tollbench/passport/tree/main/docs"
Changelog = "https://github.com/tollbench/passport/blob/main/CHANGELOG.md"
